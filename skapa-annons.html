<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skapa Gratis Annons | Fyndaren.se</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #07080a;
            --bg-card: rgba(18, 22, 31, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #e2b052;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #fff; text-align: center; }
        p.sub { color: var(--accent-gold); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; font-weight: 600; }
        
        .form-group { margin-bottom: 1.4rem; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input, select, textarea {
            width: 100%; padding: 0.9rem 1.1rem; background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); background: rgba(255, 255, 255, 0.07); }
        
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--accent-gold), #b8860b);
            color: #000; font-weight: 800; padding: 1rem; border-radius: 12px; border: none; cursor: pointer; font-size: 1rem; margin-top: 1rem;
        }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-gold); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Skapa din annons</h1>
        <p class="sub">100% Gratis & Inga dolda avgifter</p>
        
        <form onsubmit="event.preventDefault(); alert('Tack! Din annons har skickats in för granskning.'); window.location.href='index.html';">
            <div class="form-group">
                <label>Rubrik på annonsen</label>
                <input type="text" placeholder="t.ex. Volvo V60 eller iPhone 14 Pro" required>
            </div>
            
            <div class="form-group">
                <label>Kategori</label>
                <select required>
                    <option value="">Välj kategori...</option>
                    <option value="fordon">Fordon</option>
                    <option value="elektronik">Elektronik</option>
                    <option value="hem">Hem & Hushåll</option>
                    <option value="mode">Mode</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pris (SEK)</label>
                <input type="number" placeholder="t.ex. 2500" required>
            </div>

            <div class="form-group">
                <label>Stad / Ort</label>
                <input type="text" placeholder="t.ex. Göteborg" required>
            </div>

            <div class="form-group">
                <label>Beskrivning</label>
                <textarea rows="5" placeholder="Beskriv varan, skick och tillbehör..." required></textarea>
            </div>

            <div class="form-group">
                <label>Kontakt-E-post</label>
                <input type="email" placeholder="din.epost@exempel.se" required>
            </div>

            <button type="submit" class="btn-submit">Publicera annons nu</button>
        </form>

        <a href="index.html" class="back-link">← Tillbaka till Fyndaren.se</a>
    </div>
</body>
</html>
